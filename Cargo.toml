[package]
name = "Text_Changer"
authors = ["AveN RU"]
version = "0.1.3"
description = "Заменитель слов по словарю"
edition = "2024"
#build = "build.rs"
[dependencies]
#find-msvc-tools = "*"
#gpui-kit = "*"
gpui-kit = { path = "E:/Rust/gpui-kit/crates/kit" }
gpui-component-story = { path = "E:/Rust/gpui-kit/crates/story" }
#для замера ОЗУ
cap = "*"
#rmp-serde = "*"
#смешные лица
indicatif = {version = "*", features = ["rayon"]}
#постоянные данные
regex = "*"
calamine = "*"
rust_xlsxwriter = "*"
encoding_rs = "*"
encoding_rs_io = "*"
#rtf-parser = "*"
zip = "*"
#foldhash = "*"
#доп
walkdir = "*" #вложенные папки
anyhow = "*"
#clap = "*"
serde_json = "*"
convert_case = "*"
stringzilla = "*"
time = "*"
chrono = "*"
#unirust = "*"
#rzhavchina = { path = "./rzhavchina_proc_macro/" }
#sysinfo = "*"
#vergen = "*"
rayon = "*"
#xml-rs = "*"
#quick-xml = "*"
#pretty_assertions = "*"
console = "*"
#rand = "*"
smol = "*"
#dhat = "*"
#sha2 = "*"
#blake3 = "*"
rapidhash = "*"
serde = { version = "*", features = ["derive"] }
unicode-segmentation = "*"
#tokio = { version = "*", features = ["full"]  }
#okio-macros = "*"
[workspace]
members = [
    "rzhavchina_proc_macro",
    #"examples"
]
# Явно указываем разрешение не-ASCII идентификаторов
[package.metadata]
non_ascii_idents = true

[profile.dev]
debug = true  # Включить отладочную информацию

[profile.release]
debug = true  # Также

[features]
dhat-heap = []    # if you are doing heap profiling
dhat-ad-hoc = []  # if you are doing ad hoc profiling

[rust]
debuginfo-level = 1

[build-dependencies]
# Зависимости для сборки
rmp-serde = "*"
serde = { version = "*", features = ["derive"] }
rayon = "*"  # если нужно в build.rs
rapidhash = "*"  # если нужно в build.rs
regex = "*"
convert_case = "*"
rust_xlsxwriter = "*"
stringzilla = "*"

[env]
RUST_MIN_STACK = "14388608"
#объявление раздела gpui
[patch.crates-io]
rquickjs = { path = "E:/Rust/gpui-kit/crates/shell/rquickjs-compat" }
